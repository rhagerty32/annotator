name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging Python packages
        run: |
          # Homebrew Python on this image is externally managed and does not
          # ship the modules package-dmg.py and generate-icons.py import.
          python3 -m venv "${RUNNER_TEMP}/icon-python"
          "${RUNNER_TEMP}/icon-python/bin/pip" install --disable-pip-version-check \
            -r scripts/packaging-requirements.txt
          echo "${RUNNER_TEMP}/icon-python/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/icon-python/bin/python" - <<'PY'
          import ast
          import sys
          from pathlib import Path

          stdlib = sys.stdlib_module_names
          modules = set()
          for path in (
              Path("scripts/generate-icons.py"),
              Path("scripts/package-dmg.py"),
              Path("scripts/write_appcast.py"),
          ):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          modules.add(alias.name.split(".")[0])
                  elif isinstance(node, ast.ImportFrom) and node.module and node.level == 0:
                      modules.add(node.module.split(".")[0])
          third_party = sorted(modules - stdlib)
          missing = []
          for name in third_party:
              try:
                  __import__(name)
              except ModuleNotFoundError:
                  missing.append(name)
          print(sys.executable)
          print("packaging imports:", ", ".join(third_party))
          if missing:
              raise SystemExit("missing packaging imports: " + ", ".join(missing))
          PY

      - name: Generate icons
        run: python3 scripts/generate-icons.py

      - name: Select Xcode 26
        run: |
          # macos-15 boots on Xcode 16.4. ToolbarSpacer is in the macOS 26 SDK,
          # which is installed beside the default toolchain.
          shopt -s nullglob
          apps=(/Applications/Xcode_26*.app)
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "::error::No Xcode 26 is installed on this runner."
            exit 1
          fi
          selected="$(printf '%s\n' "${apps[@]}" | sed -n 's|.*/Xcode_\(.*\)\.app|\1|p' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          echo "Using Xcode ${selected}"
          sudo xcode-select -s "/Applications/Xcode_${selected}.app"
          xcodebuild -version
          swift --version

      - name: Build Swift (release)
        run: |
          set -euo pipefail
          artifact_cache="${HOME}/Library/Caches/org.swift.swiftpm/artifacts"
          sparkle_zip="${artifact_cache}/https___github_com_sparkle_project_Sparkle_releases_download_2_7_1_Sparkle_for_Swift_Package_Manager_zip"
          # Official Sparkle 2.7.1 asset. SHA-256 matches Sparkle's Package.swift
          # checksum and the GitHub release asset digest. Checked out with the
          # repo, so a 504 from the release CDN cannot block the build.
          vendored="${GITHUB_WORKSPACE}/vendor/sparkle/2.7.1/Sparkle-for-Swift-Package-Manager.zip"
          expected="3b9d424d79b1f3453cc44d23c3b0105bdff1298f5321aad8722f98b9149d5e95"
          seed_sparkle() {
            mkdir -p "${artifact_cache}"
            test -f "${vendored}"
            actual="$(shasum -a 256 "${vendored}" | awk '{print $1}')"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::Vendored Sparkle zip checksum ${actual} != ${expected}"
              return 1
            fi
            cp "${vendored}" "${sparkle_zip}"
          }
          clear_artifacts() {
            rm -rf "${artifact_cache}" "${HOME}/Library/org.swift.swiftpm"
          }
          log="$(mktemp)"
          status=1
          for attempt in 1 2 3; do
            seed_sparkle
            set +e
            swift build -c release 2>&1 | tee "${log}"
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "${status}" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -q "already exists in file system" "${log}"; then
              exit "${status}"
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit "${status}"
            fi
            echo "SwiftPM Sparkle artifact collision (attempt ${attempt}). Clearing the cache and retrying."
            clear_artifacts
          done
          exit "${status}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: raycast/package-lock.json

      - name: Install Raycast extension dependencies
        run: npm --prefix raycast ci

      - name: Type-check Raycast extension
        working-directory: raycast
        # npm exec swallows --noEmit and tsc prints its help instead of checking.
        run: ./node_modules/.bin/tsc --noEmit

      - name: Package the app and test the settings handoff
        run: |
          python3 scripts/package-dmg.py --app-only
          dist/Annotator.app/Contents/MacOS/AnnotatorBin --protocol-self-test
          dist/Annotator.app/Contents/MacOS/Annotator --protocol-self-test

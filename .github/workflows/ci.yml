name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging Python packages
        run: |
          # Homebrew Python on this image is externally managed and does not
          # ship the modules package-dmg.py and generate-icons.py import.
          python3 -m venv "${RUNNER_TEMP}/icon-python"
          "${RUNNER_TEMP}/icon-python/bin/pip" install --disable-pip-version-check \
            -r scripts/packaging-requirements.txt
          echo "${RUNNER_TEMP}/icon-python/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/icon-python/bin/python" - <<'PY'
          import ast
          import sys
          from pathlib import Path

          stdlib = sys.stdlib_module_names
          modules = set()
          for path in (
              Path("scripts/generate-icons.py"),
              Path("scripts/package-dmg.py"),
              Path("scripts/write_appcast.py"),
          ):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          modules.add(alias.name.split(".")[0])
                  elif isinstance(node, ast.ImportFrom) and node.module and node.level == 0:
                      modules.add(node.module.split(".")[0])
          third_party = sorted(modules - stdlib)
          missing = []
          for name in third_party:
              try:
                  __import__(name)
              except ModuleNotFoundError:
                  missing.append(name)
          print(sys.executable)
          print("packaging imports:", ", ".join(third_party))
          if missing:
              raise SystemExit("missing packaging imports: " + ", ".join(missing))
          PY

      - name: Generate icons
        run: python3 scripts/generate-icons.py

      - name: Select Xcode 26
        run: |
          # macos-15 boots on Xcode 16.4. ToolbarSpacer is in the macOS 26 SDK,
          # which is installed beside the default toolchain.
          shopt -s nullglob
          apps=(/Applications/Xcode_26*.app)
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "::error::No Xcode 26 is installed on this runner."
            exit 1
          fi
          selected="$(printf '%s\n' "${apps[@]}" | sed -n 's|.*/Xcode_\(.*\)\.app|\1|p' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          echo "Using Xcode ${selected}"
          sudo xcode-select -s "/Applications/Xcode_${selected}.app"
          xcodebuild -version
          swift --version

      - name: Build Swift (release)
        run: |
          set -euo pipefail
          artifact_cache="${HOME}/Library/Caches/org.swift.swiftpm/artifacts"
          sparkle_zip="${artifact_cache}/https___github_com_sparkle_project_Sparkle_releases_download_2_7_1_Sparkle_for_Swift_Package_Manager_zip"
          # Official Sparkle 2.7.1 asset. SHA-256 matches Sparkle's Package.swift
          # checksum and the GitHub release asset digest. Checked out with the
          # repo, so a 504 from the release CDN cannot block the build.
          vendored="${GITHUB_WORKSPACE}/vendor/sparkle/2.7.1/Sparkle-for-Swift-Package-Manager.zip"
          expected="3b9d424d79b1f3453cc44d23c3b0105bdff1298f5321aad8722f98b9149d5e95"
          seed_sparkle() {
            mkdir -p "${artifact_cache}"
            test -f "${vendored}"
            actual="$(shasum -a 256 "${vendored}" | awk '{print $1}')"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::Vendored Sparkle zip checksum ${actual} != ${expected}"
              return 1
            fi
            cp "${vendored}" "${sparkle_zip}"
          }
          clear_artifacts() {
            rm -rf "${artifact_cache}" "${HOME}/Library/org.swift.swiftpm"
          }
          log="$(mktemp)"
          status=1
          for attempt in 1 2 3; do
            seed_sparkle
            set +e
            swift build -c release 2>&1 | tee "${log}"
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "${status}" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -q "already exists in file system" "${log}"; then
              exit "${status}"
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit "${status}"
            fi
            echo "SwiftPM Sparkle artifact collision (attempt ${attempt}). Clearing the cache and retrying."
            clear_artifacts
          done
          exit "${status}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: raycast/package-lock.json

      - name: Install Raycast extension dependencies
        run: npm --prefix raycast ci

      - name: Type-check Raycast extension
        working-directory: raycast
        # npm exec swallows --noEmit and tsc prints its help instead of checking.
        run: ./node_modules/.bin/tsc --noEmit

      - name: Package the app and test the settings handoff
        run: |
          python3 scripts/package-dmg.py --app-only
          test "$(plutil -extract CFBundleExecutable raw dist/Annotator.app/Contents/Info.plist)" = "Annotator"
          # Codesign rewrites each copy, so compare linkage instead of bytes.
          # The old C launcher does not link Sparkle.
          otool -L dist/Annotator.app/Contents/MacOS/Annotator | grep -q Sparkle.framework
          otool -L dist/Annotator.app/Contents/MacOS/AnnotatorBin | grep -q Sparkle.framework
          dist/Annotator.app/Contents/MacOS/Annotator --protocol-self-test
          dist/Annotator.app/Contents/MacOS/AnnotatorBin --protocol-self-test
          dist/Annotator.app/Contents/MacOS/Annotator --ui-self-test
          dist/Annotator.app/Contents/MacOS/Annotator --canvas-drag-self-test
          # The runner does not reproduce MenuBarAgent's rejection of a foreign
          # image. AnnotatorBin must fail the executable-path assertion instead
          # of being accepted as the menu bar agent.
          set +e
          ui_bin="$(dist/Annotator.app/Contents/MacOS/AnnotatorBin --ui-self-test 2>&1)"
          ui_status=$?
          set -e
          printf '%s\n' "${ui_bin}"
          if [[ "${ui_status}" -eq 0 ]]; then
            echo "::error::AnnotatorBin --ui-self-test passed; the agent must be CFBundleExecutable"
            exit 1
          fi
          UI_BIN="${ui_bin}" python3 - <<'PY'
          import os, sys
          text = os.environ["UI_BIN"]
          marker = "!= bundle executable "
          lines = [line for line in text.splitlines() if marker in line]
          if not lines:
              sys.exit("missing bundle executable assertion:\n" + text)
          line = lines[-1]
          left, right = line.split(marker, 1)
          right = right.strip()
          if "/Contents/MacOS/AnnotatorBin" not in left:
              sys.exit("running image was not AnnotatorBin:\n" + line)
          if not right.endswith("/Contents/MacOS/Annotator") or right.endswith("AnnotatorBin"):
              sys.exit("expected path was not CFBundleExecutable:\n" + line)
          print("AnnotatorBin self-test expected", right)
          PY
          # Cold start: AnnotatorBin must open the bundle executable and exit.
          # The process that stays up is Contents/MacOS/Annotator.
          support="${HOME}/Library/Application Support/Annotator"
          rm -f "${support}/agent.sock"
          if pgrep -x Annotator >/dev/null 2>&1 || pgrep -x AnnotatorBin >/dev/null 2>&1; then
            pkill -x Annotator || true
            pkill -x AnnotatorBin || true
            sleep 0.5
          fi
          set +e
          handoff="$(dist/Annotator.app/Contents/MacOS/AnnotatorBin --settings 2>&1)"
          handoff_status=$?
          set -e
          printf '%s\n' "${handoff}"
          if [[ "${handoff_status}" -ne 0 ]]; then
            echo "::error::AnnotatorBin --settings did not hand off to the bundle executable"
            exit 1
          fi
          python3 - <<'PY'
          import os, signal, subprocess, sys, time

          def pids(name):
              found = subprocess.run(["pgrep", "-x", name], capture_output=True, text=True)
              if found.returncode != 0:
                  return []
              return [int(line) for line in found.stdout.split() if line.strip()]

          def executable(pid):
              listed = subprocess.run(
                  ["lsof", "-a", "-p", str(pid), "-d", "txt", "-Fn"],
                  capture_output=True,
                  text=True,
              )
              paths = [line[1:] for line in (listed.stdout or "").splitlines() if line.startswith("n")]
              for path in paths:
                  if path.endswith("/Contents/MacOS/Annotator") or path.endswith("/Contents/MacOS/AnnotatorBin"):
                      return path
              command = subprocess.run(
                  ["ps", "-ww", "-p", str(pid), "-o", "command="],
                  capture_output=True,
                  text=True,
              )
              return (command.stdout or "").strip().split(" ", 1)[0]

          deadline = time.time() + 5
          agent_pids = []
          while time.time() < deadline:
              agent_pids = pids("Annotator")
              if agent_pids and not pids("AnnotatorBin"):
                  break
              time.sleep(0.2)
          bin_pids = pids("AnnotatorBin")
          print("Annotator pids", agent_pids)
          print("AnnotatorBin pids", bin_pids)
          paths = {pid: executable(pid) for pid in agent_pids}
          for pid, path in paths.items():
              print(pid, path)
          if bin_pids:
              sys.exit("AnnotatorBin stayed up as the agent")
          wanted = "/Contents/MacOS/Annotator"
          agents = [path for path in paths.values() if path.endswith(wanted) and not path.endswith("AnnotatorBin")]
          if len(agents) != 1:
              sys.exit("expected one agent at " + wanted + ", found " + repr(list(paths.values())))
          print("cold-start agent", agents[0])
          for pid in agent_pids:
              os.kill(pid, signal.SIGTERM)
          PY
          python3 - <<'PY'
          import subprocess, sys
          log = subprocess.run(
              [
                  "log", "show", "--last", "3m", "--style", "compact",
                  "--predicate",
                  'process == "Annotator" AND eventMessage CONTAINS "scene activation failed"',
              ],
              capture_output=True,
              text=True,
          )
          text = (log.stdout or "") + (log.stderr or "")
          hits = [line for line in text.splitlines() if "scene activation failed" in line]
          if hits:
              print("\n".join(hits), file=sys.stderr)
              sys.exit("status item scene activation failed")
          print("no scene activation failed for Annotator")
          PY
          mkdir -p dist/screen-recording
          dist/Annotator.app/Contents/MacOS/Annotator --screen-recording-self-test dist/screen-recording
          test -s dist/screen-recording/initial-light.png
          test -s dist/screen-recording/initial-dark.png
          test -s dist/screen-recording/waiting.png
          test -s dist/screen-recording/success.png

      - name: Upload Screen Recording helper screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-recording-helper
          path: dist/screen-recording/*.png
          if-no-files-found: ignore

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Seed the Sparkle binary artifact cache
        run: |
          # Xcode 16.4 on macos-15 fails a cold download of this GitHub release
          # zip with "already exists in file system". SwiftPM copies a zip that
          # is already in the artifact cache instead of downloading it.
          cache="${HOME}/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "${cache}"
          curl -fsSL -o "${cache}/https___github_com_sparkle_project_Sparkle_releases_download_2_7_1_Sparkle_for_Swift_Package_Manager_zip" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.7.1/Sparkle-for-Swift-Package-Manager.zip"

      - name: Build Swift (release)
        run: swift build -c release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: raycast/package-lock.json

      - name: Install Raycast extension dependencies
        run: npm --prefix raycast ci

      - name: Type-check Raycast extension
        run: npm --prefix raycast exec -- tsc --noEmit

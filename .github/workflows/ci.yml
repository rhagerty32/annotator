name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check release tooling
        run: bash scripts/test-release-tools.sh

      - name: Build Annotator.app and DMG (ad-hoc, not published)
        run: |
          bash scripts/package-app.sh
          bash scripts/package-dmg.sh
          test -x dist/Annotator.app/Contents/MacOS/Annotator
          test -x dist/Annotator.app/Contents/MacOS/Capture
          test -d dist/Annotator.app/Contents/Frameworks/Sparkle.framework
          test -f dist/Annotator.dmg
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Annotator.app/Contents/Info.plist)" = "com.rhagerty32.annotator"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/Annotator.app/Contents/Info.plist)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Annotator.app/Contents/Info.plist)" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/Annotator.app/Contents/Info.plist)"
          codesign --verify --strict --verbose=2 dist/Annotator.app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: raycast/package-lock.json

      - name: Install Raycast extension dependencies
        run: npm --prefix raycast ci

      - name: Type-check Raycast extension
        run: npm --prefix raycast exec -- tsc --noEmit -p raycast/tsconfig.json

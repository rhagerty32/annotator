name: Release

# Publishing a GitHub Release runs this job. It attaches a notarized disk
# image, a Sparkle zip, and appcast.xml. Installed copies read the appcast from
# https://github.com/rhagerty32/annotator/releases/latest/download/appcast.xml
#
# The job fails before uploading anything when signing secrets are missing.
# Secret names and the one-time Sparkle key steps are in CONTRIBUTING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach assets to, for example v1.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: annotator-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build, sign, notarize, and write the appcast
        id: build
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: bash scripts/publish-release.sh

      - name: Upload the disk image, update zip, and appcast
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          test -n "$TAG"
          test -n "$VERSION"
          gh release upload "$TAG" \
            dist/Annotator.dmg \
            "dist/Annotator-${VERSION}.zip" \
            dist/appcast.xml \
            --clobber

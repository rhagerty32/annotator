name: Release

# Publishing a GitHub Release runs this job. It attaches the disk image, the
# Sparkle zip, and appcast.xml. Installed copies read
# https://github.com/rhagerty32/annotator/releases/latest/download/appcast.xml
#
# SPARKLE_PRIVATE_KEY is required so sign_update can write sparkle:edSignature.
# Developer ID and notarization secrets are optional. When they are absent the
# app is ad-hoc signed and the update still installs.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach assets to, for example v1.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: annotator-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          # A published release builds that tag. A manual re-run builds this
          # workflow's commit, so fixes on main are in the tree, and inputs.tag
          # is only the GitHub Release the assets are attached to.
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Select Xcode 26
        run: |
          # macos-15 boots on Xcode 16.4. ToolbarSpacer is in the macOS 26 SDK,
          # which is installed beside the default toolchain.
          shopt -s nullglob
          apps=(/Applications/Xcode_26*.app)
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "::error::No Xcode 26 is installed on this runner."
            exit 1
          fi
          selected="$(printf '%s\n' "${apps[@]}" | sed -n 's|.*/Xcode_\(.*\)\.app|\1|p' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          echo "Using Xcode ${selected}"
          sudo xcode-select -s "/Applications/Xcode_${selected}.app"
          xcodebuild -version
          swift --version

      - name: Build, sign the update zip, and write the appcast
        id: build
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          artifact_cache="${HOME}/Library/Caches/org.swift.swiftpm/artifacts"
          sparkle_zip="${artifact_cache}/https___github_com_sparkle_project_Sparkle_releases_download_2_7_1_Sparkle_for_Swift_Package_Manager_zip"
          seed_sparkle() {
            mkdir -p "${artifact_cache}"
            curl -fsSL -o "${sparkle_zip}" \
              "https://github.com/sparkle-project/Sparkle/releases/download/2.7.1/Sparkle-for-Swift-Package-Manager.zip"
          }
          clear_artifacts() {
            rm -rf "${artifact_cache}" "${HOME}/Library/org.swift.swiftpm"
          }
          log="$(mktemp)"
          status=1
          for attempt in 1 2 3; do
            seed_sparkle
            set +e
            bash scripts/publish-release.sh 2>&1 | tee "${log}"
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "${status}" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -q "already exists in file system" "${log}"; then
              exit "${status}"
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit "${status}"
            fi
            echo "SwiftPM Sparkle artifact collision (attempt ${attempt}). Clearing the cache and retrying."
            clear_artifacts
          done
          exit "${status}"

      - name: Upload the disk image, update zip, and appcast
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          test -n "$TAG"
          test -n "$VERSION"
          gh release upload "$TAG" \
            dist/Annotator.dmg \
            "dist/Annotator-${VERSION}.zip" \
            dist/appcast.xml \
            --clobber
